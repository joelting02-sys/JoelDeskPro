name: Build Windows Desktop (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag (defaults to v<package.json version>, e.g. v1.2.0).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Electron & electron-builder on Windows runner
        run: npm install --save-dev --legacy-peer-deps --no-audit --no-fund electron@33 electron-builder@25

      - name: Generate White & Blue J Windows icons
        run: node scripts/generate-icons.mjs

      - name: Build production web bundle for Electron
        env:
          ELECTRON_BUILD: 'true'
        run: npm run build

      - name: Package Windows Installer & Portable .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --win nsis portable --x64 --config electron-builder.yml --publish never

      - name: Upload Windows .exe as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Joel-Desk-Pro-Windows-x64
          path: |
            release/Joel-Desk-Pro-Setup-*.exe
            release/Joel-Desk-Pro-Portable-*.exe
          if-no-files-found: error

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Joel Desk Pro ${{ steps.meta.outputs.tag }} (Windows)
          make_latest: true
          body: |
            ## Joel Desk Pro — Windows x64 Desktop Release

            - **Setup Installer (`Joel-Desk-Pro-Setup-*-x64.exe`)**: Standard Windows installer with Desktop & Start Menu shortcuts.
            - **Portable Edition (`Joel-Desk-Pro-Portable-*-x64.exe`)**: Single-file portable `.exe` — double-click and run directly, no installation required.

            Built-in local multi-chunk download engine (`127.0.0.1:17890`), JoelDeskPro Chrome Extension bridge, and one-click Colab / Kaggle compute connectors are included automatically.
          files: |
            release/Joel-Desk-Pro-Setup-*.exe
            release/Joel-Desk-Pro-Portable-*.exe
          draft: false
          prerelease: false
